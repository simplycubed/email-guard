version: 2

# Dependency intake policy. Two rules shape every PR Dependabot opens here:
#
# 1. MAJORS ARRIVE ALONE. Each group is scoped to `update-types: [minor, patch]`,
#    so a major lands as its own individually-reviewable PR instead of riding
#    inside a 10-package group. This is not cosmetic — a grouped major poisons the
#    whole batch: three consecutive weekly dev-dependency PRs (2026-11-01, -11-08,
#    -11-15) all failed `check` on a single incompatible major while nine healthy
#    bumps sat blocked behind it. Ungrouped updates get individual PRs by default,
#    so no extra group entry is needed to express this.
# 2. NEW RELEASES AGE BEFORE WE TAKE THEM. `cooldown` holds a published version
#    for a few days so a compromised or yanked release has time to be caught
#    upstream before it reaches a PR branch here. Majors wait longest.
updates:
  # Actions are pinned by commit SHA; Dependabot keeps the SHAs (and the version
  # comments) current. `directory: /` covers every file in .github/workflows,
  # so a newly added workflow is picked up with no change here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # TypeScript 7 is held back, not skipped. typescript-eslint 8.73.0 — the
      # latest release — declares `typescript: ">=4.8.4 <6.1.0"`, and the version
      # check is a hard `Error: typescript-eslint does not support TS 7.0.`, not a
      # warning, so `pnpm lint` (and therefore the `check` gate) cannot pass with
      # TS 7 installed. Remove this entry as soon as typescript-eslint ships a
      # release whose `typescript` peer range admits 7.x.
      # Accepted tradeoff: unlike `cooldown`, which applies to version updates
      # only, `ignore` DOES suppress security updates — so a TypeScript 7.x
      # advisory would not open a PR while this entry stands. Acceptable here
      # because typescript is devDependency-only and `files: ["dist", "src"]`
      # never ships a compiler, so a TS advisory is a CI/workstation risk, not a
      # consumer supply-chain one. Revisit if typescript ever becomes a runtime
      # dependency.
      # Tracked by: https://github.com/simplycubed/email-guard/issues/7
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Order matters: Dependabot assigns each dependency to the FIRST group it
    # matches, so the version-locked families have to come before the catch-all.
    groups:
      # eslint and @eslint/js move together or not at all — @eslint/js@10.0.1
      # declares `eslint: "^10.0.0"`. typescript-eslint rides along because its
      # peer range already spans `^8.57.0 || ^9.0.0 || ^10.0.0`, and because it is
      # the package whose next release lifts the TypeScript hold in #7.
      eslint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "@typescript-eslint/*"]
      # Same shape, tighter: @vitest/coverage-v8 pins vitest to an EXACT version
      # (`{ vitest: "5.1.1" }` on 5.1.1, `{ vitest: "4.1.12" }` on 4.1.12), so a
      # PR carrying one without the other cannot resolve, let alone pass `check`.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # Deliberately NO `update-types` filter on the two groups above. The
      # minor/patch scoping that stops a major poisoning a ten-package batch would,
      # applied here, split a version-locked pair into two PRs that each fail on
      # their own — relocating the deadlock instead of removing it. A family is the
      # unit of update at every semver level.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
